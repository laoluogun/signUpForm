<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="image">
        <div class="container">
            <img class="overlay" src="odin-lined.png">
            <p>The Odin Project</p>
        </div>
    </div>
    <div class="main">
        <div class="text">
            <p>This is not a real online service! You know you need something<br>
            like this in your life to help you realize your deepest dreams. <br>
        Sign up <em>now</em> to get started.
        <br>
        <br>
    You <em>know</em> you want to.</p>
        </div>
        <div class="formfields">
            <h3>Let's do this!</h3>
            <div class="form">
            <form action>
                <section>
                    <div class="leftForm">
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" name="fname" required>
                    </div>
                    <div class="rightForm">
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" name="lname" required>
                    </div>
                </section>
                <br style="clear:both;" />
                <section>
                    <div class="leftForm">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="rightForm">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </section>
                <br style="clear:both;" />
                <section>
                        <div class="leftForm">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" required>
                        </div>
                        <div class="rightForm">
                            <label for="cpassword">Confirm Password</label>
                            <input type="password" id="cpassword" nmme="cpassword" required>
                        </div>
    
                </section>
            </form>
        </div>
        </div>
        <div class="signUpButton">
            <button type="button" class="signUp">Create an account</button>
            <p>Already have an account? <a href="https://www.fotmob.com/en-GB">Log in here!</a></p>
        </div>
    </div>
</body>
</html>
